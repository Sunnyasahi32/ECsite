<html>
    
<head>
    <title>ショッピングカート</title>
</head>

<body>
    <h1>ショッピングカート内の商品一覧</h1>
    <table border="1">
        <tr>
            <th>商品名</th>
            <th>商品の色</th>
            <th>メーカー名</th>
            <th>価格</th>
            <th>数量</th>
        </tr>
        {% for cart in cartitems %}
        <tr>
            <td>{{cart.item.name}}</td>
            <td>{{cart.item.color}}</td>
            <td>{{cart.item.manufacturer}}</td>
            <td>{{cart.item.price}}</td>
            <td>{{cart.amount}}個</td>
        </tr>
        {%endfor%}

    </table>
    合計 {{sum}} 円

    <a href ="{% url 'ECapp:main' %}">商品検索</a>へ

</body>



</html>
