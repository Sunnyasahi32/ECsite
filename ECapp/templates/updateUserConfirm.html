<html>
    
<head>
    <title>会員情報の更新</title>
</head>

<body>
    <h1>以下の会員情報で更新しますか？</h1>
    <form action= "{% url 'ECapp:update_user_confirm' %} " method='POST'>
        <table border="1">
            <tr>
                <th>会員ID</th>
                <th>{{form.user_id}}</th>
            </tr>
            <tr>
                <th>パスワード</th>
                <th>{{form.password}}</th>
            </tr>
            <tr>
                <th>お名前</th>
                <th>{{form.name}}</th>
            </tr>
            <tr>
                <th>ご住所</th>
                <th>{{form.address}}</th>
            </tr>
            
        </table>
        {% csrf_token %}
        <input type="submit" value="変更" />
    </form>

    
        
        <a href ="{% url 'ECapp:main' %}">商品検索</a>へ
</body>



</html>
